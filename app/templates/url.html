<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scan Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</head>

<body>

  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">🛡️</div>
      <span>PhishGuard</span>
    </div>
    <nav class="sidebar-nav">
      <a href="/" class="nav-link">Overview</a>
      <a href="/scan" class="nav-link active">Scan Center</a>
      <a href="/insights" class="nav-link">Insights</a>
      <a href="/threat" class="nav-link">Threat Intelligence</a>
      <a href="/history" class="nav-link">Activity Log</a>
      <a href="/settings" class="nav-link">Settings</a>
      <a href="/about" class="nav-link">About</a>
    </nav>
  </aside>

  <main class="main">
    <header class="page-header">
      <h1>Scan Center</h1>
      <p>Analyze URLs and messages for phishing threats</p>
    </header>

    <section class="scan-tabs">
      <button class="tab active" data-target="url-scan">URL Scan</button>
      <button class="tab" data-target="message-scan">Message Scan</button>
    </section>

    <section id="url-scan" class="scan-section active">
      <h2>URL Scan</h2>
      <input type="text" id="url-input" placeholder="Enter URL here">
      <button id="url-scan-btn">Scan</button>
      <div id="url-scan-result"></div>
    </section>

    <section id="message-scan" class="scan-section">
      <h2>Message Scan</h2>
      <textarea id="message-input" placeholder="Paste message here"></textarea>
      <button id="message-scan-btn">Scan</button>
      <div id="message-scan-result"></div>
    </section>
  </main>

</body>

</html>
