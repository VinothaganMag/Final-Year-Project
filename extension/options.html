<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CRIS Link Guard — Options</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 24px; max-width: 480px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; }
        input { width: 100%; padding: 8px; font-size: 14px; box-sizing: border-box; }
        button { margin-top: 12px; padding: 8px 16px; font-size: 14px; cursor: pointer; }
        p.hint { color: #64748b; font-size: 13px; }
        #status { color: #16a34a; font-size: 13px; min-height: 18px; }
    </style>
</head>
<body>
    <h1>CRIS Link Guard</h1>
    <label for="origin">Analyzer origin</label>
    <input id="origin" type="text" placeholder="http://127.0.0.1:5000">
    <p class="hint">
        Must match a host listed in the extension manifest. Changing the port also requires updating
        <code>host_permissions</code> and the content script match pattern in <code>manifest.json</code>.
    </p>
    <button id="save">Save</button>
    <p id="status"></p>
    <script src="options.js"></script>
</body>
</html>
